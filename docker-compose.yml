services:
  kafka:
    image: apache/kafka:3.9.0
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://127.0.0.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka: { condition: service_healthy }
    restart: 'no'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        for spec in transactions:6 decisions:6 quarantine:6 transactions.dlq:3; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists \
            --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1
        done

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  processor:
    build: { context: ., args: { APP: processor } }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: kafka:19092
      REDIS_ADDR: redis:6379
    ports: ['2112:2112']
    restart: unless-stopped
    stop_grace_period: 30s # longer than the processor's 20s drain timeout

  gateway:
    build: { context: ., args: { APP: gateway } }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      HTTP_ADDR: ':8080'
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 random bytes}
      KAFKA_BROKERS: kafka:19092
      REDIS_ADDR: redis:6379
      # Behind a real load balancer, list its CIDR so X-Forwarded-For is trusted:
      # TRUSTED_PROXIES: 10.0.0.0/8
      # Restrict callers to known merchant egress ranges:
      # ALLOWED_CIDRS: 203.0.113.0/24
    ports: ['8080:8080', '9100:9100']
    restart: unless-stopped
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ['./prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    ports: ['9090:9090']
